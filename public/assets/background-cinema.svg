<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="50%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="cityGlow" cx="72%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#C4A574" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a28"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1280" fill="url(#night)"/>
  <ellipse cx="1380" cy="720" rx="560" ry="300" fill="url(#cityGlow)"/>
  <!-- city lights -->
  <g opacity="0.55" fill="#F3EFE8">
    <rect x="980" y="600" width="20" height="48"/>
    <rect x="1020" y="575" width="16" height="73"/>
    <rect x="1055" y="615" width="24" height="33"/>
    <rect x="1100" y="560" width="18" height="88"/>
    <rect x="1140" y="595" width="22" height="53"/>
    <rect x="1185" y="545" width="16" height="103"/>
    <rect x="1225" y="580" width="28" height="68"/>
    <rect x="1280" y="530" width="20" height="118"/>
    <rect x="1325" y="570" width="17" height="78"/>
    <rect x="1365" y="540" width="24" height="108"/>
    <rect x="1415" y="585" width="16" height="63"/>
    <rect x="1455" y="550" width="22" height="98"/>
    <rect x="1500" y="605" width="18" height="43"/>
    <rect x="1540" y="565" width="26" height="83"/>
  </g>
  <g opacity="0.35" fill="#C4A574">
    <circle cx="1030" cy="630" r="2.5"/>
    <circle cx="1120" cy="650" r="2"/>
    <circle cx="1240" cy="620" r="2.5"/>
    <circle cx="1350" cy="640" r="2"/>
    <circle cx="1460" cy="625" r="2.5"/>
  </g>
  <!-- near window -->
  <rect x="180" y="140" width="480" height="720" fill="url(#win)" opacity="0.55" rx="2"/>
  <rect x="180" y="140" width="480" height="720" fill="none" stroke="#F3EFE8" stroke-opacity="0.14" stroke-width="3"/>
  <line x1="420" y1="140" x2="420" y2="860" stroke="#090909" stroke-width="10" opacity="0.55"/>
  <line x1="180" y1="500" x2="660" y2="500" stroke="#090909" stroke-width="10" opacity="0.55"/>
  <rect x="0" y="0" width="1920" height="1280" fill="#090909" opacity="0.12"/>
</svg>
